<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header { text-align: center; margin-bottom: 30px; }
    .clock { font-size: 3.5rem; font-weight: 700; letter-spacing: -1px; }
    .date { color: var(--text-muted); font-size: 1.1rem; text-transform: capitalize; margin-top: 4px; }

    .search-box {
      width: 100%;
      max-width: 600px;
      margin-bottom: 40px;
    }
    .search-box form { display: flex; gap: 8px; }
    .search-box input {
      flex: 1;
      padding: 14px 20px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
    }
    .card h3 {
      font-size: 1rem;
      color: var(--accent);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card ul { list-style: none; }
    .card li { margin-bottom: 10px; }
    .card a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      display: block;
      transition: color 0.15s;
    }
    .card a:hover { color: var(--accent); }

    .notes textarea {
      width: 100%;
      height: 120px;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">Laddar datum...</div>
  </div>

  <div class="search-box">
    <form action="https://www.google.com/search" method="get">
      <input type="text" name="q" placeholder="Sök på Google..." autofocus autocomplete="off">
    </form>
  </div>

  <div class="grid">
    <!-- Kategori: Dagligt -->
    <div class="card">
      <h3>Dagligt</h3>
      <ul>
        <li><a href="https://mail.google.com" target="_blank">Gmail</a></li>
        <li><a href="https://calendar.google.com" target="_blank">Kalender</a></li>
        <li><a href="https://bankid.com" target="_blank">BankID / Internetbank</a></li>
        <li><a href="https://github.com" target="_blank">GitHub</a></li>
      </ul>
    </div>

    <!-- Kategori: Nyheter & Media -->
    <div class="card">
      <h3>Nyheter & Media</h3>
      <ul>
        <li><a href="https://svt.se" target="_blank">SVT Nyheter</a></li>
        <li><a href="https://omni.se" target="_blank">Omni</a></li>
        <li><a href="https://youtube.com" target="_blank">YouTube</a></li>
        <li><a href="https://reddit.com" target="_blank">Reddit</a></li>
      </ul>
    </div>

    <!-- Kategori: Mina Verktyg -->
    <div class="card">
      <h3>Verktyg</h3>
      <ul>
        <li><a href="../swish/" target="_blank">Min Swish-generator</a></li>
        <li><a href="https://yr.no" target="_blank">Yr Väder</a></li>
        <li><a href="https://chatgpt.com" target="_blank">AI / Chatta</a></li>
      </ul>
    </div>

    <!-- Kategori: Snabbanteckningar -->
    <div class="card">
      <h3>Snabbanteckningar</h3>
      <div class="notes">
        <textarea id="notePad" placeholder="Skriv något här... sparas automatiskt i webbläsaren."></textarea>
      </div>
    </div>
  </div>

  <script>
    // Klocka och datum
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Auto-save för anteckningar
    const notePad = document.getElementById('notePad');
    notePad.value = localStorage.getItem('dashboard_note') || '';
    notePad.addEventListener('input', () => {
      localStorage.setItem('dashboard_note', notePad.value);
    });
  </script>
</body>
</html>
